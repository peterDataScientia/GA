name: Graphical abstract
on:
  push:
    branches: [main]
    paths:
      - main.tex
      - 'assets/**'
      - '.github/workflows/graphical-abstract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
      - name: Update PDF and preview
        run: |
          cp main.pdf graphical_abstract.pdf
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdftoppm -f 1 -l 1 -singlefile -r 140 -png graphical_abstract.pdf preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphical_abstract.pdf preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Graphical abstract"
            git push
          fi
